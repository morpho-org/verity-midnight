# Egress proxy for agent containers. Agents run on an internal Docker network
# whose only route out is this proxy, and the proxy only forwards to hosts
# matching /egress/allow (one extended regex per line, matched on the host name).
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
# Model responses can stream for a long time between bytes.
Timeout 3600
MaxClients 64
LogFile "/egress/tinyproxy.log"
# Connect level logs both forwarded hosts and refusals.
LogLevel Connect
DisableViaHeader Yes
ConnectPort 443
FilterDefaultDeny Yes
Filter "/egress/allow"
FilterType ere
FilterCaseSensitive No
FilterURLs No
